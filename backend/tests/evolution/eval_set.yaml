    category: skill_route
    expected: task-plan
  - id: s05_research_skill
    category: skill_route
    expected: research
  - id: d01_code_subagent
    category: subagent_delegate
    expected: code
  - id: d02_writing_subagent
    category: subagent_delegate
    expected: writing
  - id: d03_data_subagent
    category: subagent_delegate
    expected: data
  - id: d04_research_subagent
    category: subagent_delegate
    expected: research
  - id: d05_plan_subagent
    category: subagent_delegate
    expected: plan
