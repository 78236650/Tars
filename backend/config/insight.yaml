# InsightForge 鉴数 — INS-2.0.0
capability:
  name: insight-forge
  version: INS-2.0.0

databases:
  tier1: [oracle, mysql, postgresql, doris]
  tier2: [jdbc]
  tier2_note: "jdbc 使用 GenericStatsDialect 降级 Profile"

profile:
  max_tables: 80
  max_columns_per_table: 60
  sample_rows_per_table: 500
  core_table_top_n: 20
  stats_timeout_sec: 15
  table_timeout_sec: 120
  parallel_tables: 3
  llm_batch_tables: 8
  llm_max_tokens_per_batch: 6000
  skip_table_patterns: ["^_", "^tmp_", "^bak_"]
  enable_incremental: true
  incremental_ttl_hours: 24

forge:
  pending_question_ttl_seconds: 1800

qa:
  fewshot_max_items: 5
  fewshot_max_tokens: 2000
  fewshot_recall_timeout_ms: 200
  allow_ad_hoc_sql: true

metric_qa:
  max_sql_rows: 1000
  sql_timeout_sec: 30
  require_metric_citation: true
  allow_ad_hoc_sql: true

adoption:
  require_review: false
  publish_to_knowledge: true

knowledge_bridge:
  enabled: true
  timeout_ms: 500
  meeting_collection_prefixes: ["meeting"]
  max_snippet_chars: 200
  max_total_chars: 1500

feedback:
  downgrade_window_days: 30
  downgrade_min_down: 3
  downgrade_ratio_min: 0.30
  downgrade_cooldown_days: 7

feature_flags:
  chat_first_enabled: true

publish:
  chunk_size: 400
  chunk_overlap: 80
  auto_approve_metrics: false
