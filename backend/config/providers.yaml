# TARS v4.0.0: LLM Provider Configuration
# Defines available providers, their endpoints, and default model.

default_provider: ollama-local

providers:
  ollama-local:
    type: ollama
    base_url: http://localhost:11434
    default_model: llama3.2
    display_name: Ollama (本地)

