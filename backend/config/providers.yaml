# TARS v5.2.0: LLM Provider Configuration
# Defines available providers, their endpoints, and default model.

default_provider: deepseek

providers:
  deepseek:
    type: openai_compat
    base_url: https://api.deepseek.com/v1
    default_model: deepseek-v4-pro
    api_key: "${DEEPSEEK_API_KEY}"
    display_name: DeepSeek

  ollama-local:
    type: ollama
    base_url: http://localhost:11434
    default_model: qwen3:4b
    display_name: Ollama (本地)

  # Qwen API（备用）
  # qwen:
  #   type: openai_compat
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   default_model: qwen-max
  #   api_key: "${DASHSCOPE_API_KEY}"
  #   display_name: Qwen (阿里云)

# v4.1.0: 主 Provider 失败时按 chain 降级
fallback:
  enabled: true
  chain:
    - { provider: ollama-local, model: qwen3:4b }
  retry_on: [429, 500, 502, 503, 504, timeout]
  max_attempts: 3
