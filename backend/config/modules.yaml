# TARS v4.0.0: Module Configuration
# Controls which optional feature modules are enabled on startup.

modules:
  # Core modules (always enabled)
  core:
    - agent
    - tools
    - skills
    - memory
    - auth
    - security

  # Optional modules (enable/disable per deployment)
  optional:
    meeting:
      enabled: true
      description: "会议助手（录音转写 + 摘要）"
      routes: ["/api/meeting"]
    bi:
      enabled: true
      description: "BI 工作台（数据分析 + 可视化）"
      routes: ["/api/bi", "/api/datasources"]
    insight:
      enabled: true
      description: "InsightForge 鉴数 — 对话优先 Copilot INS-2.1.0"
      requires: [bi, knowledge]
      capability_tag: insight-forge
      version: INS-2.1.0
      routes: ["/api/insight"]
    knowledge:
      enabled: true
      description: "知识库（文档解析 + RAG）"
      routes: ["/api/knowledge"]
    skillhub:
      enabled: true
      description: "SkillHub 技能市场"
      routes: ["/api/skillhub"]
    orchestration:
      enabled: true
      description: "多 Agent 调度任务（编排记忆可视）"
      routes: ["/api/orchestration"]

# v4.3.2 Superpowers integration
skill_routing:
  enabled: true

plan_gate:
  enabled: true
  always_approve: false
  force_auto_approve: false
  auto_approve_threshold: 3
  review_timeout_sec: 600
  reminder_at_sec: 300
  fallback_auto_approve: true

verification:
  enabled: true
  default_mode: strict
  lenient_pass_rate: 0.8
  fail_action: rollback
