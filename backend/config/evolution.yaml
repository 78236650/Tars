# Evolution system configuration — v4.2.1+
eval_gate:
  improve_min: 0.10
  regress_max: -0.05

prompt_writeback:
  max_tuned_chars: 800

insight_burst:
  window_days: 7
  min_downvotes: 3

ingest:
  save_state_every_n_turns: 5
  save_state_min_interval_seconds: 5
  optimize_async: true

# Self-Evolving Skills: distill agent execution trajectories into reusable SKILL.md files
case_distillation:
  enabled: true
  # Minimum cases in a cluster before distillation triggers
  min_cases_per_cluster: 5
  # Maximum skills generated per optimize cycle
  max_skills_per_run: 3
  # Cap on cases fed into a single distillation prompt (controls prompt length)
  max_cases_per_skill: 30
  # Require admin approval before activating distilled skills (recommended for prod)
  approval_required: true
