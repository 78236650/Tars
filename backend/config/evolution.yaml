# Evolution system configuration — v5.3.0 feedback_only mode
mode: feedback_only

eval_gate:
  improve_min: 0.10
  regress_max: -0.05

prompt_writeback:
  max_tuned_chars: 800

insight_burst:
  window_days: 7
  min_downvotes: 3

ingest:
  save_state_every_n_turns: 5
  save_state_min_interval_seconds: 5
  optimize_async: false

# Frozen in feedback_only mode — case distillation disabled
case_distillation:
  enabled: false
  min_cases_per_cluster: 5
  max_skills_per_run: 3
  max_cases_per_skill: 30
  approval_required: true
