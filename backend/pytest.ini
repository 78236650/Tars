[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short -m "not insight_perf"
markers =
    insight_eval: InsightForge metric QA eval set (H8)
    insight_perf: InsightForge profile perf benchmarks (INS-2.1, requires INSIGHT_PERF_BENCH=1)
    evolution_eval: Evolution self-improvement eval set (Phase 2)
    skill_eval: Skill routing hit-rate / false-trigger eval (M1)
    integration: InsightForge end-to-end workflow integration tests
    insight_smoke: InsightForge full-stack smoke (main FastAPI app)
