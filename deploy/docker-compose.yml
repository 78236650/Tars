# TARS v5.0 — production compose (Postgres + single uvicorn worker)
# Usage: cd deploy && cp .env.example .env && docker compose up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tars
      POSTGRES_PASSWORD: tars
      POSTGRES_DB: tars
    volumes:
      - tars-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tars -d tars"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "${TARS_BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend/config:/app/config:ro
      - tars-data:/app/data
      - ../skills:/app/skills:ro
    env_file:
      - .env
    environment:
      - TARS_DATA_DIR=/app/data
      - DATABASE_URL=postgresql://tars:tars@postgres:5432/tars
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${TARS_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tars-data:
  tars-pg-data:
