repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c 'cd backend && ruff check --fix .'
        language: system
        types: [python]
        pass_filenames: false
      - id: black
        name: black
        entry: bash -c 'cd backend && black .'
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-quick
        name: pytest-quick
        entry: bash -c 'cd backend && pytest -q -x'
        language: system
        pass_filenames: false
        stages: [pre-push]
