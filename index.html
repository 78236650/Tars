<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>五子棋</title>
    <style>
        #board { display: grid; grid-template-columns: repeat(15, 30px); grid-template-rows: repeat(15, 30px); gap: 2px; margin: 20px auto; width: 450px;}
        .cell { width: 30px; height: 30px; background: #f0d9b5; border: 1px solid #b58863; }
        .black { background: black; border: 2px solid white; }
        .white { background: white; border: 2px solid black; }
    </style>
</head>
<body>
    <div id="board"></div>
    <button onclick="resetGame()">重置</button>
    <script>
        const board = document.getElementById('board');
        let currentPlayer = 'black';
        let gameBoard = Array(15).fill().map(() => Array(15).fill(null));

        function createBoard() {
            board.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                for (let j = 0; j < 15; j++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    cell.addEventListener('click', () => placePiece(i, j));
                    board.appendChild(cell);
                }
            }
        }

        function placePiece(row, col) {
            if (gameBoard[row][col] || checkWin()) return;
            gameBoard[row][col] = currentPlayer;
            const cell = board.children[row * 15 + col];
            cell.classList.add(currentPlayer);
            if (checkWin()) return;
            currentPlayer = currentPlayer === 'black' ? 'white' : 'black';
        }

        function checkWin() {
            const directions = [[1,0],[0,1],[1,1],[-1,1]];
            for (let i = 0; i < 15; i++) {
                for (let j = 0; j < 15; j++) {
                    if (gameBoard[i][j] && checkDirection(i, j, directions[0])) {
                        alert(`玩家${currentPlayer}胜利！`);
                        return true;
                    }
                }
            }
            return false;
        }

        function checkDirection(row, col, dir) {
            let count = 1;
            for (let i = 1; i < 5; i++) {
                const r = row + dir[0] * i;
                const c = col + dir[1] * i;
                if (r < 0 || r >= 15 || c < 0 || c >= 15 || gameBoard[r][c] !== currentPlayer) break;
                count++;
            }
            for (let i = 1; i < 5; i++) {
                const r = row - dir[0] * i;
                const c = col - dir[1] * i;
                if (r < 0 || r >= 15 || c < 0 || c >= 15 || gameBoard[r][c] !== currentPlayer) break;
                count++;
            }
            return count >= 5;
        }

        function resetGame() {
            gameBoard = Array(15).fill().map(() => Array(15).fill(null));
            currentPlayer = 'black';
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
