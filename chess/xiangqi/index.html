<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋 - 人机对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .turn-indicator {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .turn-red { color: #e74c3c; }
        .turn-black { color: #2c3e50; }

        .board-container {
            position: relative;
            width: 450px;
            height: 500px;
            margin: 0 auto;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }

        .difficulty {
            text-align: center;
            margin-top: 15px;
        }

        .difficulty label {
            margin-right: 10px;
            font-weight: bold;
        }

        select {
            padding: 8px 12px;
            font-size: 1em;
            border-radius: 6px;
            border: 2px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏯 中国象棋</h1>
        
        <div class="game-info">
            <div class="turn-indicator turn-red" id="turnIndicator">红方回合</div>
            <div id="gameStatus">游戏进行中</div>
        </div>

        <div class="board-container">
            <canvas id="boardCanvas" width="450" height="500"></canvas>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="restartGame()">重新开始</button>
            <button class="btn-secondary" onclick="undoMove()">悔棋</button>
        </div>

        <div class="difficulty">
            <label for="difficulty">AI难度：</label>
            <select id="difficulty" onchange="changeDifficulty()">
                <option value="1">简单</option>
                <option value="2" selected>中等</option>
                <option value="3">困难</option>
            </select>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
