name: TARS CI
displayName: TARS CI
triggers:
  push:
    - branches:
        precise:
          - main
          - v4.3.2
  pr:
    - branches:
        precise:
          - main
stages:
  - name: lint-and-test
    displayName: Lint & Test
    failFast: true
    jobs:
      backend:
        name: backend
        runsOn: ubuntu-latest
        steps:
          - name: setup-python
            uses: shell-exec
            with:
              shell: |
                python3 -m venv backend/venv
                . backend/venv/bin/activate
                pip install -r backend/requirements.txt
          - name: lint
            uses: shell-exec
            with:
              shell: |
                . backend/venv/bin/activate
                cd backend && ruff check .
          - name: test
            uses: shell-exec
            with:
              shell: |
                . backend/venv/bin/activate
                cd backend && pytest -q
      frontend:
        name: frontend
        runsOn: ubuntu-latest
        steps:
          - name: build
            uses: shell-exec
            with:
              shell: |
                cd frontend && npm ci && npm run build
