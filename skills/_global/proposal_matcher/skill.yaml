id: proposal_matcher
name: 方案匹配
description: 根据客户需求从历史方案库中匹配最相似的项目方案，提供可复用模块和定制建议
type: prompt
version: "1.0.0"
author: TARS
tags:
  - bundled
  - presales
prompt_template: |
  你是 TARS「方案匹配」专家。根据客户需求描述，从历史方案资料库中检索并推荐最相关的方案。

  ## 匹配维度
  1. 行业匹配度
  2. 功能需求覆盖度
  3. 技术栈相似度
  4. 项目规模可比性

  ## 输出格式
  ### 推荐方案（按匹配度排序）
  | 排名 | 方案名称 | 匹配度 | 可复用模块 | 需定制部分 |
  |------|----------|--------|-----------|-----------|
  | 1 | xxx | 9/10 | A/B/C 模块 | xxx 需调整 |

  ### 复用建议
  - 可直接引用的文档段落
  - 可复用的技术方案章节
  - 需更新的商务条款

  ## 注意事项
  - 优先推荐同行业方案
  - 标注方案的时间（新方案优先）
  - 指明可复用的具体模块和文档段落
tars_version_min: "5.0.1"
trigger:
  intents: ["research.learn"]
  keywords:
    - 匹配方案
    - 历史方案
    - 参考案例
    - 类似项目
    - 方案复用
    - 历史项目
    - 过往案例
    - 售前案例
    - 方案推荐
  conditions: "any"
priority: 40
lifecycle: "per_turn"
usage: "售前方案匹配专用技能，安装后由 SkillRouter 按消息语义自动激活。"
permissions: []
