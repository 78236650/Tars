, NULL),\n\n-- test-sqlite: 通用指标\n('m-007', '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5', '4a863625-6bc1-472d-8ce1-c83511c95e49', \n 'table_count', '数据表数量', '数据库中用户表的数量', \n 'SELECT COUNT(*) AS value FROM sqlite_master WHERE type = ''table''', '[]', 'approved', 'manual', 0.9, datetime('now'), datetime('now'), 1, NULL),\n\n('m-008', '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5', '4a863625-6bc1-472d-8ce1-c83511c95e49', \n 'record_count', '总记录数', '数据库中所有表的记录总数（估算）', \n 'SELECT SUM(pgsize - unused) / 1024 AS value FROM dbstat', '[]', 'approved', 'manual', 0.8, datetime('now'), datetime('now'), 1, NULL)\n;\n\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 -header data/tars.db \"SELECT metric_key, display_name, status, datasource_id FROM insight_metrics ORDER BY datasource_id, metric_key;\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 data/tars.db \"UPDATE insight_metrics SET datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c' WHERE metric_key = 'total_orders';\" && sqlite3 -header data/tars.db \"SELECT metric_key, display_name, datasource_id FROM insight_metrics ORDER BY datasource_id, metric_key;\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 -header data/tars.db \"SELECT metric_key, display_name, definition, substr(sql_template, 1, 80) as sql_preview FROM insight_metrics WHERE source = 'manual';\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 -header data/tars.db \"SELECT id, name, db_type, connection_url, substr(connection_config_json, 1, 120) as config_json FROM bi_datasources;\")", "Bash(# Check available MySQL/Postgres\necho \"=== MySQL ===\" && (mysql --version 2>/dev/null || echo \"mysql client not found\") && (pg_isready 2>/dev/null || echo \"pg_isready not found\") && echo \"=== Docker ===\" && (docker ps --format 'table {{.Names}}\\t{{.Image}}\\t{{.Ports}}' 2>/dev/null | head -10 || echo \"docker not available\") && echo \"=== Port check ===\" && (lsof -i :3306 -P 2>/dev/null | head -5 || echo \"nothing on 3306\") && (lsof -i :5432 -P 2>/dev/null | head -5 || echo \"nothing on 5432\") && (lsof -i :3307 -P 2>/dev/null | head -5 || echo \"nothing on 3307\"))", "Bash(# Check if we can connect to the docker mysql and what databases/tables exist\ndocker exec tars-insight-mysql mysql -u root -proot_insight -e \"SHOW DATABASES;\" 2>/dev/null || docker exec tars-insight-mysql mysql -u insight -pinsight_pass -e \"SHOW DATABASES;\" 2>/dev/null || docker exec tars-insight-mysql mysql -u root -e \"SHOW DATABASES;\" 2>/dev/null)", "Bash(docker exec tars-insight-mysql mysql -u root -proot_insight -e \"\nSELECT '=== insight_demo ===' AS ''; \nUSE insight_demo; SHOW TABLES;\nSELECT '=== smart_stowage ===' AS ''; \nUSE smart_stowage; SHOW TABLES;\n\" 2>/dev/null)", "Bash(docker exec tars-insight-mysql mysql -u root -proot_insight -e \"\nUSE insight_demo;\nSHOW CREATE TABLE users\\G\nSHOW CREATE TABLE orders\\G\n\" 2>/dev/null)", "Bash(docker exec tars-insight-mysql mysql -u root -proot_insight -e \"\nUSE insight_demo;\nSELECT COUNT(*) AS users_count FROM users;\nSELECT COUNT(*) AS orders_count FROM orders;\nSELECT status, COUNT(*) AS cnt FROM orders GROUP BY status;\nSELECT '--- sample users ---' AS '';\nSELECT * FROM users;\nSELECT '--- sample orders (first 5) ---' AS '';\nSELECT id, user_id, status, amount, created_at FROM orders ORDER BY created_at DESC LIMIT 5;\n\" 2>/dev/null)", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 data/tars.db \"\n-- 修正 SQL 模板以匹配 insight_demo 实际表结构\n-- users: id, name, city, created_at\n-- orders: id, user_id, status(pending/paid/refunded), amount, created_at\n\nUPDATE insight_metrics SET \n  sql_template = 'SELECT COUNT(*) AS value FROM users',\n  definition = '平台累计注册用户总数，反映平台用户规模（数据来源：users表）'\nWHERE metric_key = 'total_users' AND datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c';\n\nUPDATE insight_metrics SET \n  display_name = '已支付订单数',\n  definition = '已支付订单的总数量，反映实际成交单量（status=paid）',\n  sql_template = 'SELECT COUNT(*) AS value FROM orders WHERE status = ''paid''',\n  metric_key = 'paid_orders'\nWHERE metric_key = 'daily_active_users' AND datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c';\n\nUPDATE insight_metrics SET \n  sql_template = 'SELECT COUNT(*) AS value FROM orders',\n  definition = '平台累计订单总量（含所有状态），反映业务规模（数据来源：orders表）'\nWHERE metric_key = 'total_orders' AND datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c';\n\nUPDATE insight_metrics SET \n  sql_template = 'SELECT COUNT(*) AS value FROM orders WHERE DATE(created_at) = ''{{as_of_date}}''',\n  definition = '当日新增订单数，反映每日业务量'\nWHERE metric_key = 'daily_orders' AND datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c';\n\nUPDATE insight_metrics SET \n  sql_template = 'SELECT COALESCE(SUM(amount), 0) AS value FROM orders WHERE status = ''paid''',\n  definition = '平台累计已支付订单交易总额(GMV)，反映平台交易规模'\nWHERE metric_key = 'gmv' AND datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c';\n\nUPDATE insight_metrics SET \n  sql_template = 'SELECT COALESCE(SUM(amount), 0) AS value FROM orders WHERE status = ''paid'' AND DATE(created_at) = ''{{as_of_date}}''',\n  definition = '当日已支付订单的交易总额'\nWHERE metric_key = 'daily_gmv' AND datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c';\n\n-- 新增一条：今日新增用户数\nINSERT OR REPLACE INTO insight_metrics (id, datasource_id, tenant_id, metric_key, display_name, definition, sql_template, tables_json, status, source, confidence, created_at, updated_at, version, superseded_by)\nVALUES ('m-009', 'bd565063-1d8b-48bb-94e8-35da70a3c53c', '4a863625-6bc1-472d-8ce1-c83511c95e49', \n 'daily_new_users', '日新增用户数', '当天新注册的用户数量', \n 'SELECT COUNT(*) AS value FROM users WHERE DATE(created_at) = ''{{as_of_date}}''', '[\\\"users\\\"]', 'approved', 'manual', 0.9, datetime('now'), datetime('now'), 1, NULL);\n\n-- 新增：各城市用户数\nINSERT OR REPLACE INTO insight_metrics (id, datasource_id, tenant_id, metric_key, display_name, definition, sql_template, tables_json, status, source, confidence, created_at, updated_at, version, superseded_by)\nVALUES ('m-010', 'bd565063-1d8b-48bb-94e8-35da70a3c53c', '4a863625-6bc1-472d-8ce1-c83511c95e49', \n 'users_by_city', '各城市用户分布', '按城市统计用户数量分布', \n 'SELECT city, COUNT(*) AS cnt FROM users GROUP BY city ORDER BY cnt DESC', '[\\\"users\\\"]', 'approved', 'manual', 0.9, datetime('now'), datetime('now'), 1, NULL);\n\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 -header data/tars.db \"\nSELECT metric_key, display_name, status, substr(sql_template, 1, 100) as sql_preview \nFROM insight_metrics \nWHERE datasource_id = 'bd565063-1d8b-48bb-94e8-35da70a3c53c'\nORDER BY metric_key;\n\" && echo \"---\" && echo \"test-sqlite db file:\" && ls -la /var/folders/s4/86jkh95s75v6jv64dzl5vtzh0000gn/T/tmpiy8sojnc.db 2>/dev/null || echo \"FILE NOT FOUND (temp file cleaned up)\")", "Bash(ls -la /var/folders/s4/86jkh95s75v6jv64dzl5vtzh0000gn/T/tmpmqz8n74e.db 2>/dev/null || echo \"admin-create-test db also gone\")", "Bash(# Create a proper test SQLite database\nDB_PATH=\"/Users/daobanxiang/myproject/TARS/backend/data/test_insight.db\"\nsqlite3 \"$DB_PATH\" \"\nCREATE TABLE IF NOT EXISTS products (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  name TEXT NOT NULL,\n  category TEXT NOT NULL,\n  price REAL NOT NULL,\n  stock INTEGER NOT NULL DEFAULT 0,\n  created_at TEXT NOT NULL DEFAULT (datetime('now'))\n);\nCREATE TABLE IF NOT EXISTS sales (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  product_id INTEGER NOT NULL,\n  quantity INTEGER NOT NULL,\n  amount REAL NOT NULL,\n  sale_date TEXT NOT NULL,\n  FOREIGN KEY (product_id) REFERENCES products(id)\n);\n-- 插入测试数据\nINSERT OR IGNORE INTO products VALUES (1, '集装箱追踪器', '物流设备', 2999.00, 150, '2026-01-15');\nINSERT OR IGNORE INTO products VALUES (2, '智能锁', '安防设备', 599.00, 500, '2026-01-20');\nINSERT OR IGNORE INTO products VALUES (3, '温控传感器', '传感器', 199.00, 300, '2026-02-01');\nINSERT OR IGNORE INTO products VALUES (4, 'GPS定位模块', '物流设备', 899.00, 200, '2026-02-10');\nINSERT OR IGNORE INTO products VALUES (5, 'RFID读写器', '物流设备', 1599.00, 80, '2026-03-01');\nINSERT OR IGNORE INTO sales VALUES (1, 1, 10, 29990.00, '2026-05-01');\nINSERT OR IGNORE INTO sales VALUES (2, 2, 50, 29950.00, '2026-05-02');\nINSERT OR IGNORE INTO sales VALUES (3, 1, 5, 14995.00, '2026-05-03');\nINSERT OR IGNORE INTO sales VALUES (4, 3, 20, 3980.00, '2026-05-03');\nINSERT OR IGNORE INTO sales VALUES (5, 4, 8, 7192.00, '2026-05-04');\nINSERT OR IGNORE INTO sales VALUES (6, 5, 3, 4797.00, '2026-05-04');\nINSERT OR IGNORE INTO sales VALUES (7, 2, 30, 17970.00, '2026-05-05');\nINSERT OR IGNORE INTO sales VALUES (8, 1, 15, 44985.00, '2026-05-05');\n\" && echo \"Created: $DB_PATH\" && echo \"Products:\" && sqlite3 \"$DB_PATH\" \"SELECT * FROM products;\" && echo \"Sales:\" && sqlite3 \"$DB_PATH\" \"SELECT * FROM sales;\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 data/tars.db \"\n-- 更新 test-sqlite 数据源指向新的持久化数据库\nUPDATE bi_datasources \nSET connection_url = 'sqlite:////Users/daobanxiang/myproject/TARS/backend/data/test_insight.db'\nWHERE id = '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5';\n\n-- 删除 admin-create-test（临时文件没了）\nDELETE FROM bi_datasources WHERE id = '2ad709ba-e4dc-4e48-9557-767dbd634036';\n-- 同时删除 TARS BI 测试库（没有可用连接）\nDELETE FROM bi_datasources WHERE id = 'f675544b-c1fd-47e8-b408-60e3f66b52ec';\n-- 删除对应的烂指标\nDELETE FROM insight_metrics WHERE datasource_id = 'f675544b-c1fd-47e8-b408-60e3f66b52ec';\n\n-- 更新 test-sqlite 指标的 SQL 模板\nUPDATE insight_metrics SET \n  sql_template = 'SELECT COUNT(*) AS value FROM products',\n  definition = '产品总数量（数据来源：products表）',\n  tables_json = '[\\\"products\\\"]'\nWHERE metric_key = 'table_count' AND datasource_id = '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5';\n\nUPDATE insight_metrics SET \n  metric_key = 'product_categories',\n  display_name = '产品分类数',\n  definition = '产品的分类种类数量',\n  sql_template = 'SELECT COUNT(DISTINCT category) AS value FROM products',\n  tables_json = '[\\\"products\\\"]'\nWHERE metric_key = 'record_count' AND datasource_id = '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5';\n\n-- 新增：总销售额\nINSERT OR REPLACE INTO insight_metrics (id, datasource_id, tenant_id, metric_key, display_name, definition, sql_template, tables_json, status, source, confidence, created_at, updated_at, version, superseded_by)\nVALUES ('m-011', '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5', '4a863625-6bc1-472d-8ce1-c83511c95e49', \n 'total_sales', '总销售额', '所有销售记录的总金额', \n 'SELECT COALESCE(SUM(amount), 0) AS value FROM sales', '[\\\"sales\\\"]', 'approved', 'manual', 0.9, datetime('now'), datetime('now'), 1, NULL);\n\n-- 新增：库存总量\nINSERT OR REPLACE INTO insight_metrics (id, datasource_id, tenant_id, metric_key, display_name, definition, sql_template, tables_json, status, source, confidence, created_at, updated_at, version, superseded_by)\nVALUES ('m-012', '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5', '4a863625-6bc1-472d-8ce1-c83511c95e49', \n 'total_stock', '总库存量', '所有产品的库存总量', \n 'SELECT SUM(stock) AS value FROM products', '[\\\"products\\\"]', 'approved', 'manual', 0.9, datetime('now'), datetime('now'), 1, NULL);\n\n-- 新增：订单数\nINSERT OR REPLACE INTO insight_metrics (id, datasource_id, tenant_id, metric_key, display_name, definition, sql_template, tables_json, status, source, confidence, created_at, updated_at, version, superseded_by)\nVALUES ('m-013', '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5', '4a863625-6bc1-472d-8ce1-c83511c95e49', \n 'sales_count', '销售订单数', '销售记录总条数', \n 'SELECT COUNT(*) AS value FROM sales', '[\\\"sales\\\"]', 'approved', 'manual', 0.9, datetime('now'), datetime('now'), 1, NULL);\n\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && echo \"=== 数据源 ===\" && sqlite3 -header data/tars.db \"SELECT id, name, db_type, connection_url FROM bi_datasources;\" && echo \"\" && echo \"=== 指标 ===\" && sqlite3 -header data/tars.db \"\nSELECT \n  d.name AS datasource, \n  m.metric_key, \n  m.display_name, \n  m.status,\n  substr(m.sql_template, 1, 80) as sql_preview\nFROM insight_metrics m\nLEFT JOIN bi_datasources d ON m.datasource_id = d.id\nORDER BY d.name, m.metric_key;\n\")", "Bash(# Check if insight user exists in MySQL\ndocker exec tars-insight-mysql mysql -u root -proot_insight -e \"SELECT user, host FROM mysql.user WHERE user = 'insight';\" && echo \"---\" && docker exec tars-insight-mysql mysql -u insight -pinsight_pass -e \"SELECT 1 AS connection_test;\" 2>&1)", "Bash(docker exec tars-insight-mysql mysql -u insight -pinsight_pass -e \"USE insight_demo; SELECT COUNT(*) FROM users; SELECT COUNT(*) FROM orders;\" 2>&1)", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && sqlite3 data/tars.db \"\n-- 修正 table_count 名称和 SQL（让它真正统计表数量）\nUPDATE insight_metrics SET \n  display_name = '产品数量',\n  definition = '产品表中商品总数'\nWHERE metric_key = 'table_count' AND datasource_id = '4ba4f4d4-b92e-4f14-8dd9-de31cb7277b5';\n\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && ls -la *.log 2>/dev/null; ls -la logs/ 2>/dev/null; find . -name \"*.log\" -mtime -1 2>/dev/null | head -10)", "Bash(# Check if backend is running and try to find its output\nps aux | grep -i \"uvicorn\\|python.*main\\|fastapi\" | grep -v grep)", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && tail -100 nohup-backend.log)", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && grep -i \"error\\|fail\\|exception\\|traceback\\|all connection\" nohup-backend.log | tail -30)", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && grep -rn \"All connection\" nohup-backend.log 2>/dev/null | tail -5; grep -rn \"ask\" nohup-backend.log 2>/dev/null | grep -i \"error\\|fail\\|40[0-9]\\|500\" | tail -10; echo \"---\"; grep \"POST.*ask\" nohup-backend.log | tail -5)", "Bash(cd /Users/daobanxiang/myproject/TARS/backend && grep -n \"error\\|Error\\|ERROR\\|fail\\|Fail\" nohup-backend.log | grep -v \"JSONDecodeError\\|reflector\\|info\\|INFO\" | tail -20)", "Bash(# Check if Ollama is running\ncurl -s http://localhost:11434/api/tags 2>/dev/null | head -3 || echo \"Ollama not reachable\")", "Bash(cd /Users/daobanxiang/myproject/TARS/backend &&